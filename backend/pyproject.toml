[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neofrontier-planetary-backend"
version = "0.1.0"
description = "Exploratory Moon and Mars candidate-site screening from planetary raster data"
requires-python = ">=3.11"
dependencies = [
  "affine>=2.4",
  "numpy>=1.26",
  "rasterio>=1.3.10",
]

[project.scripts]
planetary-backend = "planetary_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
